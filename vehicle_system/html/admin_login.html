<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=login.html?role=admin">
    <title>Admin Login | DriveEase</title>
    <script>
        (function() {
            var search = window.location.search || '';
            var target = 'login.html?role=admin';
            if (search) {
                var query = search.replace(/^\?/, '').replace(/(?:^|&)role=[^&]*/g, '').replace(/^&+|&+$/g, '');
                if (query) target += '&' + query;
            }
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p>Redirecting to <a href="login.html?role=admin">Admin Login</a>…</p>
</body>
</html>
