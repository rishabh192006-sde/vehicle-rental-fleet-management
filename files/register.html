<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | DriveEase</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script>
        (function() {
            try {
                var t = localStorage.getItem('driveease_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            } catch(e) {}
        })();
    </script>
</head>

<body class="auth-page">

    <button class="theme-toggle-btn theme-toggle-fixed" id="themeToggle" type="button" aria-label="Toggle theme" title="Toggle theme">🌙</button>

    <div class="auth-box wide">

        <a class="brand center" href="index.html">
            <span class="brand-mark">D</span> DriveEase
        </a>

        <p class="eyebrow">CUSTOMER REGISTRATION</p>

        <h1>Create your account</h1>

        <form id="registerForm" action="profile.html">

            <div class="form-row">

                <label>
                    First name
                    <input type="text" name="first-name" data-validate="name" autocomplete="given-name" placeholder="First name">
                </label>

                <label>
                    Last name
                    <input type="text" name="last-name" data-validate="name" autocomplete="family-name" placeholder="Last name">
                </label>

            </div>

            <label>
                Email address
                <input type="email" name="email" data-validate="email" autocomplete="email" placeholder="you@example.com">
            </label>

            <div class="form-row">

                <label>
                    Phone
                    <input type="tel" name="phone" data-validate="phone" placeholder="10-digit mobile number">
                </label>

                <label>
                    Password
                    <input type="password" name="password" id="regPassword" data-validate="password" autocomplete="new-password" placeholder="Min 8 chars, letters + numbers">
                </label>

            </div>

            <label>
                Confirm Password
                <input type="password" name="confirm-password" id="regConfirmPassword" data-validate="required" autocomplete="off" placeholder="Re-enter your password">
            </label>
            <div class="confirm-error" id="regConfirmError">⚠ Passwords do not match.</div>

            <label>
                Address
                <textarea name="address" data-validate="message" placeholder="Enter address"></textarea>
            </label>

            <button class="btn btn-primary full" type="submit">
                Register
            </button>

        </form>

        <p class="center muted">
            Already registered?
            <a href="login.html">Sign in</a>
        </p>

        <p class="center muted" style="margin-top:10px;font-size:0.85rem;">
            Fleet staff? <a href="admin_register.html">Admin registration →</a>
        </p>

    </div>

<script src="data.js"></script>
<script src="validate.js"></script>
<script>
    const { UserStore, AdminStore } = window.DriveEase || {};

    document.getElementById('registerForm').addEventListener('form:valid', function(e) {
        e.preventDefault(); // handle redirect ourselves

        const form    = e.target;
        const pwd     = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirmPassword').value;
        const errBox  = document.getElementById('regConfirmError');

        /* Confirm password must match */
        if (pwd !== confirm) {
            errBox.classList.add('show');
            document.getElementById('regConfirmPassword').focus();
            return;
        }
        errBox.classList.remove('show');

        const firstName = form.querySelector('[name="first-name"]').value.trim();
        const lastName  = form.querySelector('[name="last-name"]').value.trim();
        const email     = form.querySelector('[name="email"]').value.trim().toLowerCase();
        const phone     = form.querySelector('[name="phone"]').value.trim();
        const address   = form.querySelector('[name="address"]').value.trim();

        /* Cannot register an administrator email as a customer */
        if (AdminStore && AdminStore.isAdmin(email)) {
            alert('This email address is reserved for system administrators and cannot be registered as a customer account.');
            form.querySelector('[name="email"]')?.focus();
            return;
        }

        /* Save profile via UserStore or localStorage without auto-login */
        if (UserStore) {
            UserStore.saveUser({ firstName, lastName, email, phone, address, password: pwd }, false);
        } else {
            try {
                const users = JSON.parse(localStorage.getItem('driveease_users') || '{}');
                users[email] = { firstName, lastName, email, phone, address, password: pwd, createdAt: Date.now() };
                localStorage.setItem('driveease_users', JSON.stringify(users));
                // Do not auto-login: user should log in manually
            } catch(err) {
                console.warn('Could not save profile to localStorage', err);
            }
        }

        /* Redirect to login page */
        const params = new URLSearchParams({
            registered: '1',
            email: email
        });
        window.location.href = 'login.html?' + params.toString();
    });

    /* Live confirm-password match feedback */
    const regPwd     = document.getElementById('regPassword');
    const regConfirm = document.getElementById('regConfirmPassword');
    const regErrBox  = document.getElementById('regConfirmError');

    function checkConfirm() {
        if (regConfirm.value && regPwd.value !== regConfirm.value) {
            regConfirm.classList.add('is-invalid');
            regConfirm.classList.remove('is-valid');
            regErrBox.classList.add('show');
        } else if (regConfirm.value && regPwd.value === regConfirm.value) {
            regConfirm.classList.remove('is-invalid');
            regConfirm.classList.add('is-valid');
            regErrBox.classList.remove('show');
        } else {
            regConfirm.classList.remove('is-invalid', 'is-valid');
            regErrBox.classList.remove('show');
        }
    }

    regPwd.addEventListener('input', checkConfirm);
    regConfirm.addEventListener('input', checkConfirm);
</script>
</body>

</html>
